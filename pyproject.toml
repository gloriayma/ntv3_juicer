[project]
name = "ntv3-juicer"
version = "0.1.0"
description = "Does the NTv3 per-track head learn biology, or just modality?"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.6",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "safetensors>=0.4",
    "pyarrow>=16",
]

[tool.setuptools.packages.find]
include = ["juicer*"]
